packages:
  - apps/*
  - packages/*

# pnpm 12 reads these from here, not from .npmrc (only auth/registry settings live in .npmrc).
saveExact: true
strictPeerDependencies: true
engineStrict: true
# Supply-chain: only reviewed packages may run install scripts (04 §2 R9).
strictDepBuilds: true
allowBuilds:
  esbuild: true
  lefthook: true
  # Optional native accelerator for msgpackr (BullMQ); the pure-JS fallback is used. No native builds in images.
  msgpackr-extract: false
  # Its postinstall only copies the browser mock worker into a public/ folder; tests use msw/node only.
  msw: false
# Supply-chain (04 §2 R9): no version younger than 3 days (same as Renovate), no git/tarball sources below
# direct dependencies, and fail when a package's provenance/trust level drops versus its earlier releases.
minimumReleaseAge: 4320
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Reviewed 14 Oct 2026 (DECISIONS #49): build/test-time only, pulled in by official parents; excluded per exact
# version, so any newer version is checked again.
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1' # workbox-build 7.4.1 (vite-plugin-pwa) pins it
  - 'chromium-bidi@157.0.8090-0' # Google; via lighthouse → puppeteer-core
  - 'semver@6.3.1' # 2023 backport release of semver 6
