# Nightly checks (10 §7, 04 §12.1): fresh vulnerability data against unchanged code, repeated motion-perf runs,
# and — once staging exists (T0.14: repository variables STAGING_APP_URL / STAGING_ADMIN_URL) — an OWASP ZAP
# baseline and Lighthouse against staging. GitHub e-mails the owner when a scheduled run fails.
# Phase 1+ adds: retention-job dry run on staging, `db:verify-roles` against staging Atlas.
name: Nightly

on:
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  LEFTHOOK: '0'
  TZ: Asia/Kolkata
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2

jobs:
  dependencies:
    name: Dependency vulnerabilities (fresh advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: docker run --rm -v "$PWD:/src" "$OSV_IMAGE" scan source --lockfile /src/pnpm-lock.yaml
      - run: pnpm audit --prod --audit-level high

  images-perf:
    name: Images (Trivy, fresh DB) · motion perf ×3
    # ubuntu-22.04 while GitHub's ubuntu-24.04 image runs kernel 7.0.0: MongoDB 8.x refuses to start on 6.19–7.0.13
    # (TCMalloc rseq crash, SERVER-121912; fixed kernel ≥ 7.0.14). Back to 24.04 then — DECISIONS #76, PROGRESS F35.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm setup:local
      - run: echo "127.0.0.1 app.localhost admin.localhost" | sudo tee -a /etc/hosts
      - run: pnpm --filter @mc/app --filter @mc/admin build
      # The APIs' /health checks MongoDB (PHASE_01 T1.6): a fresh runner needs the DB users + migrations first.
      - name: MongoDB users + migrations (db:reset)
        run: |
          pnpm db:start
          pnpm db:reset
      - run: node scripts/compose.mjs stack up --build
      - name: Trivy (all fixable HIGH/CRITICAL)
        run: |
          for image in mc-server:local mc-caddy:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - run: pnpm exec playwright install --with-deps chromium
      - name: Motion performance, three repeats (08 §8 — catches rare long tasks, PROGRESS F20)
        run: pnpm exec playwright test --project=perf --workers=1 --repeat-each=3
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-perf
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The images actually deployed to staging (the digests in the published manifest), scanned with today's advisories:
  # the job above scans fresh local builds, which can differ from what is running (re-review S-L13).
  deployed-images:
    name: Deployed staging images (Trivy, fresh DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # the staging-current pre-release
      packages: read # pull the deployed images from GHCR
    steps:
      - name: Deployed digests from the published manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download staging-current --repo "$GITHUB_REPOSITORY" -p release-manifest.json; then
            echo "::notice title=No staging release yet::nothing deployed to scan"
            echo "IMAGES=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "IMAGES=$(jq -r '.images | to_entries | map(.value) | join(" ")' release-manifest.json)" >> "$GITHUB_ENV"
      - name: Trivy (all fixable HIGH/CRITICAL)
        if: env.IMAGES != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in $IMAGES; do
            case "$image" in ghcr.io/syedtalha88/*@sha256:*) ;; *) echo "::error::unexpected image $image"; exit 1 ;; esac
            docker pull -q "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  staging:
    name: Staging — ZAP baseline · security headers · Lighthouse
    if: vars.STAGING_APP_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: OWASP ZAP baseline (passive) — both origins, fail on medium+
        env:
          APP: ${{ vars.STAGING_APP_URL }}
          ADMIN: ${{ vars.STAGING_ADMIN_URL }}
        # zap-baseline.py reports every rule as WARN and -I keeps WARN from failing the script, so the gate is applied
        # here from the JSON report: any alert with risk Medium (2) or High (3) fails the job (review S-L13, V-4).
        run: |
          mkdir -p zap && chmod 777 zap
          for target in "$APP" "$ADMIN"; do
            name=$(echo "$target" | sed 's|https://||; s|/.*||')
            docker run --rm -v "$PWD/zap:/zap/wrk" "$ZAP_IMAGE" zap-baseline.py -t "$target" -l WARN -I \
              -r "$name.html" -J "$name.json"
          done
          node scripts/zap-gate.mjs zap "$APP" "$ADMIN"
      - run: pnpm exec playwright install --with-deps chromium
      # The deploy itself smoke-tests inside the server (infra/vps/deploy.sh); the public header set (04 §7, CSP,
      # Trusted Types, noindex) is checked here against the live staging hosts through Cloudflare (verifier V-4).
      - name: Security headers on staging (04 §7)
        env:
          E2E_APP_URL: ${{ vars.STAGING_APP_URL }}
          E2E_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
        run: pnpm exec playwright test e2e/smoke/security-headers.spec.ts --project=pixel-7
      - name: Lighthouse budgets against staging
        env:
          E2E_APP_URL: ${{ vars.STAGING_APP_URL }}
          E2E_ADMIN_URL: ${{ vars.STAGING_ADMIN_URL }}
        run: pnpm lhci
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-staging
          path: |
            zap/
            .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
