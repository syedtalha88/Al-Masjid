# Staging release (DECISIONS #21, #27, #42, #49): the last job of CI on pushes to this repository's main — after
# every other CI job passed — calls this workflow. It builds the server and web images from that commit, pushes
# them to GHCR, and writes a release manifest of their digests. CI never connects to the VPS (#27): the VPS polls
# for new manifests and deploys by digest (T0.14 — manifest signing + publishing, PROGRESS F25).
# Not triggered by workflow_run: that event also fires for pull requests from forks whose branch is named `main`
# and would build untrusted code with packages: write (Semgrep: workflow-run-target-code-checkout).
# The web image needs the staging environment's public build variables (Settings → Environments → staging →
# Variables: VITE_PUBLIC_APP_ORIGIN, VITE_PUBLIC_MEDIA_ORIGIN, VITE_PUBLIC_VAPID_PUBLIC_KEY,
# VITE_PUBLIC_TURNSTILE_SITE_KEY, VITE_PUBLIC_SENTRY_DSN); until they exist the web image is skipped with a notice.
name: Deploy staging

on:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Optional — source-map upload (DECISIONS #52)
        required: false
      RELEASE_SIGNING_KEY:
        # A secret of the staging environment only (DECISIONS #55). The caller must still pass it by name, or it
        # resolves to "" here; with `environment: staging` on the job, GitHub supplies the environment's value.
        description: Staging release-signing key (environment secret)
        required: true
  # No workflow_dispatch: a staging release only ever follows a green CI run on main (review S-L13).

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/syedtalha88

jobs:
  publish:
    name: Build · push by digest · release manifest
    if: github.repository == 'syedtalha88/Al-Masjid' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: write # the staging-current pre-release assets (DECISIONS #55)
      packages: write # push images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # the commit CI just tested
      - name: Release id
        run: echo "RELEASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Server image (runtime target — no test hooks)
        run: |
          docker buildx build --push --provenance=false \
            -f infra/docker/server.Dockerfile --target runtime \
            --build-arg RELEASE="$RELEASE" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$RELEASE" \
            -t "$REGISTRY/al-masjid-server:sha-$RELEASE" \
            --metadata-file server.json .
          echo "SERVER_DIGEST=$(node -p "require('./server.json')['containerimage.digest']")" >> "$GITHUB_ENV"

      - name: Web image (Caddy + both PWAs built for staging)
        if: vars.VITE_PUBLIC_APP_ORIGIN != ''
        env:
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.VITE_PUBLIC_APP_ORIGIN }}
          VITE_PUBLIC_MEDIA_ORIGIN: ${{ vars.VITE_PUBLIC_MEDIA_ORIGIN }}
          VITE_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VITE_PUBLIC_VAPID_PUBLIC_KEY }}
          VITE_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VITE_PUBLIC_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_SENTRY_DSN: ${{ vars.VITE_PUBLIC_SENTRY_DSN }}
          VITE_PUBLIC_SHOWCASE: 'true' # staging only: /_dev/showcase for the owner's checks (DECISIONS #58)
        run: |
          docker buildx build --push --provenance=false \
            -f infra/docker/caddy.Dockerfile --target runtime \
            --build-arg RELEASE="$RELEASE" \
            --build-arg VITE_PUBLIC_APP_ORIGIN --build-arg VITE_PUBLIC_MEDIA_ORIGIN \
            --build-arg VITE_PUBLIC_VAPID_PUBLIC_KEY --build-arg VITE_PUBLIC_TURNSTILE_SITE_KEY \
            --build-arg VITE_PUBLIC_SENTRY_DSN --build-arg VITE_PUBLIC_SHOWCASE \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$RELEASE" \
            -t "$REGISTRY/al-masjid-web:staging-sha-$RELEASE" \
            --metadata-file web.json .
          echo "WEB_DIGEST=$(node -p "require('./web.json')['containerimage.digest']")" >> "$GITHUB_ENV"
      - name: Web image skipped
        if: vars.VITE_PUBLIC_APP_ORIGIN == ''
        run: echo "::notice title=Web image skipped::Set the staging environment variables (VITE_PUBLIC_*) — T0.14."

      # Source maps go to Sentry only (never served, never in an image — T0.13). Skipped until the owner creates
      # the Sentry projects: secret SENTRY_AUTH_TOKEN, variables SENTRY_ORG, SENTRY_PROJECT_WEB, SENTRY_PROJECT_SERVER.
      - name: Source maps → Sentry (when configured)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
          SENTRY_PROJECT_SERVER: ${{ vars.SENTRY_PROJECT_SERVER }}
          SENTRY_CLI_IMAGE: getsentry/sentry-cli:3.8.0@sha256:973a77ecc96852081f946e36a8f090ed74a02249009594aff51575e593871427
          WEB_BUILT: ${{ vars.VITE_PUBLIC_APP_ORIGIN != '' }}
          WEB_URL_PREFIX: '~/assets' # Sentry's URL-prefix syntax (any host), not a home directory
          VITE_PUBLIC_APP_ORIGIN: ${{ vars.VITE_PUBLIC_APP_ORIGIN }}
          VITE_PUBLIC_MEDIA_ORIGIN: ${{ vars.VITE_PUBLIC_MEDIA_ORIGIN }}
          VITE_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VITE_PUBLIC_VAPID_PUBLIC_KEY }}
          VITE_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.VITE_PUBLIC_TURNSTILE_SITE_KEY }}
          VITE_PUBLIC_SENTRY_DSN: ${{ vars.VITE_PUBLIC_SENTRY_DSN }}
          VITE_PUBLIC_SHOWCASE: 'true' # same build args as the web image, so the same build layer is reused
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ]; then
            echo "::notice title=Source maps not uploaded::Sentry is not configured yet (DECISIONS #35)."
            exit 0
          fi
          upload() { # <project> <dir> <url-prefix>
            docker run --rm -v "$PWD/maps:/maps:ro" -e SENTRY_AUTH_TOKEN -e SENTRY_ORG "$SENTRY_CLI_IMAGE" \
              sourcemaps upload --project "$1" --release "$RELEASE" --url-prefix "$3" "$2"
          }
          docker buildx build -f infra/docker/server.Dockerfile --target server-maps \
            --build-arg RELEASE="$RELEASE" --output type=local,dest=maps/server .
          upload "$SENTRY_PROJECT_SERVER" /maps/server '/app/dist'
          if [ "$WEB_BUILT" = 'true' ]; then
            docker buildx build -f infra/docker/caddy.Dockerfile --target web-maps \
              --build-arg RELEASE="$RELEASE" \
              --build-arg VITE_PUBLIC_APP_ORIGIN --build-arg VITE_PUBLIC_MEDIA_ORIGIN \
              --build-arg VITE_PUBLIC_VAPID_PUBLIC_KEY --build-arg VITE_PUBLIC_TURNSTILE_SITE_KEY \
              --build-arg VITE_PUBLIC_SENTRY_DSN --build-arg VITE_PUBLIC_SHOWCASE --output type=local,dest=maps/web .
            upload "$SENTRY_PROJECT_WEB" /maps/web/app "$WEB_URL_PREFIX"
            upload "$SENTRY_PROJECT_WEB" /maps/web/admin "$WEB_URL_PREFIX"
          fi

      - name: Release manifest (digests the VPS deploys)
        env:
          ENVIRONMENT: staging
        run: node scripts/release-manifest.mjs

      # DECISIONS #55: OpenSSH signature + a fixed pre-release the VPS polls with curl. The key exists since 15 Oct 2026
      # (environment secret RELEASE_SIGNING_KEY), so a missing key now fails the release instead of skipping quietly.
      - name: Sign and publish the manifest for the VPS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error title=Manifest not signed::RELEASE_SIGNING_KEY is empty — check the staging environment secret and that ci.yml passes it (DECISIONS #55)."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing-key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          ssh-keygen -q -Y sign -f "$key" -n masjid-connect-release release-manifest.json
          rm -f "$key"
          if ! gh release view staging-current >/dev/null 2>&1; then
            gh release create staging-current --prerelease --title 'Staging (current release)' \
              --notes 'Signed release manifest the staging server deploys (DECISIONS #55). Replaced on every release.'
          fi
          gh release upload staging-current release-manifest.json release-manifest.json.sig --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-staging
          retention-days: 90
          if-no-files-found: error
          path: |
            release-manifest.json
            release-manifest.json.sig
