# CI (10 §7, PHASE_00 T0.3). Runs on every push to main and every pull request; all jobs are required checks.
# Supply chain (04 §12.1, R9): GitHub's own actions only, pinned by commit SHA; scanners run as Docker images
# pinned by digest; least-privilege token; concurrent runs of the same ref are cancelled.
name: CI

on:
  push:
    # ci/** = CI changes tried on a branch before they reach main.
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  LEFTHOOK: '0'
  TZ: Asia/Kolkata
  FORCE_COLOR: '1'
  # Scanner images (Renovate keeps the digests current).
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  UBUNTU_IMAGE: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  # ------------------------------------------------------------------------------------------------
  static:
    name: Typecheck · lint · format · i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check

  # ------------------------------------------------------------------------------------------------
  unit:
    name: Unit + component tests (coverage gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: '**/coverage/coverage-summary.json'
          retention-days: 14
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: ./.github/actions/setup
      - name: actionlint (workflows, incl. shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: gitleaks (whole history, redacted)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 1
      - name: osv-scanner (lockfile)
        run: docker run --rm -v "$PWD:/src" "$OSV_IMAGE" scan source --lockfile /src/pnpm-lock.yaml
      - name: pnpm audit (production dependencies, high+)
        run: pnpm audit --prod --audit-level high
      - name: Semgrep rule tests (.semgrep)
        run: docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep test .semgrep
      # Excluded rules (DECISIONS #49): npm is not used (pnpm 12 ignores install settings in .npmrc), the
      # 3-day release age is set once for pnpm and once globally for Renovate (the rules want more days / one per rule).
      - name: Semgrep (project rules + OWASP Top 10)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan
          --config .semgrep --config p/owasp-top-ten --metrics=off --error
          --exclude .semgrep --exclude .claude
          --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age
          --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
          --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
      - name: hadolint
        run: |
          for file in infra/docker/*.Dockerfile; do
            echo "::group::$file"
            docker run --rm -i "$HADOLINT_IMAGE" < "$file"
            echo "::endgroup::"
          done
      - name: shellcheck + executable bit (VPS scripts)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" infra/vps/*.sh infra/vps/test/*.sh
          # systemd runs these directly (infra/vps/systemd) — a missing +x is a 203/EXEC on the server.
          not_exec=$(git ls-files -s -- 'infra/vps/*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$not_exec" ]; then
            echo "::error::not executable in git (git update-index --chmod=+x): $not_exec"
            exit 1
          fi
      - name: VPS deploy — release verification tests (DECISIONS #55)
        run: docker run --rm -v "$PWD/infra/vps:/vps:ro" "$UBUNTU_IMAGE" bash /vps/test/deploy-verify.test.sh
      - name: Trivy config (Dockerfiles, compose)
        run: docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config --severity HIGH,CRITICAL --exit-code 1 /src/infra

  # ------------------------------------------------------------------------------------------------
  integration:
    name: Integration tests (MongoDB + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Local env (random passwords, ACL, keyfile)
        run: pnpm setup:local
      - name: MongoDB (replica set + auth) + Redis (ACL)
        run: pnpm db:start
      - name: Redis/MongoDB security checks
        run: pnpm --filter @mc/server verify:local
      - run: pnpm test:int
      - run: pnpm db:test
      - name: Service diagnostics (annotations)
        if: failure()
        run: |
          node scripts/ci-annotate.mjs 'dev services' node scripts/compose.mjs dev ps -a
          node scripts/ci-annotate.mjs 'dev service logs' node scripts/compose.mjs dev logs

  # ------------------------------------------------------------------------------------------------
  build-e2e:
    name: Build · budgets · images · e2e · Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Local env
        run: pnpm setup:local
      - name: Resolve *.localhost for every client (Node's resolver included)
        run: echo "127.0.0.1 app.localhost admin.localhost" | sudo tee -a /etc/hosts

      # Production builds + checks on the built files.
      - name: Build both PWAs (production)
        run: pnpm --filter @mc/app --filter @mc/admin build
      - name: No dev-only code in production builds
        run: pnpm check:dist
      - name: Client bundles contain only VITE_PUBLIC_* (self-test, then scan)
        run: pnpm scan:bundles
      - name: Bundle budgets (01 §9, DECISIONS #47)
        run: pnpm size

      # Images: the shipped runtime and the e2e runtime-test (DECISIONS #31).
      - name: Shipped stack (runtime image) up
        run: node scripts/compose.mjs stack up --build
      - name: runtime image has no test hooks
        run: pnpm check:image mc-server:local
      - name: Trivy (images, HIGH/CRITICAL with a fix available)
        run: |
          for image in mc-server:local mc-caddy:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Vite dev server for the dev-only showcase spec (warmed before tests)
        run: |
          pnpm --filter @mc/app dev --port 5173 --strictPort > vite-dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5173/_dev/showcase > /dev/null
          node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto('http://localhost:5173/_dev/showcase');await p.waitForSelector('[data-showcase-section=buttons]',{timeout:120000});await b.close()})()"
      - name: E2E (Pixel 7 + iPhone 14) — axe, CSP guard, per-locale screenshots
        run: pnpm test:e2e
      # Measurements below need a quiet machine: the dev server (showcase only) is no longer needed.
      - name: Stop the Vite dev server
        if: always()
        run: pkill -f 'vite.*--port 5173' || true
      - name: Motion performance (08 §8, 4× CPU)
        run: pnpm test:perf
      - name: Lighthouse budgets (01 §9) — median of 5 runs per page
        env:
          LHCI_RUNS: '5'
        run: |
          set -o pipefail
          pnpm lhci 2>&1 | tee lhci.log
      - name: Lighthouse diagnostics (annotation)
        if: failure() && hashFiles('lhci.log') != ''
        run: node scripts/ci-annotate.mjs 'lighthouse output' tail -n 80 lhci.log

      # The e2e image: hooks present and working through Caddy.
      - name: Test stack (runtime-test image) up
        run: node scripts/compose.mjs stack-test up --build
      - name: runtime-test image has the hooks (only in test-hooks.mjs)
        run: pnpm check:image mc-server:test --expect-hooks
      - name: Test hooks through Caddy
        env:
          E2E_TEST_HOOKS: '1'
        run: pnpm exec playwright test e2e/smoke/test-hooks.spec.ts --project=pixel-7

      - name: Stack diagnostics (annotations)
        if: failure()
        run: |
          node scripts/ci-annotate.mjs 'stack services' node scripts/compose.mjs stack-test ps -a
          node scripts/ci-annotate.mjs 'stack logs' node scripts/compose.mjs stack-test logs
      - name: Reports (Playwright, screenshots, Lighthouse)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
            vite-dev.log
          retention-days: 14
          if-no-files-found: ignore

  # ------------------------------------------------------------------------------------------------
  # Pushes to main only, after every job above passed: build + push the release images, write the manifest.
  release-staging:
    name: Release to staging
    needs: [static, unit, security, integration, build-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'syedtalha88/Al-Masjid'
    permissions:
      contents: write # release assets (DECISIONS #55)
      packages: write
    uses: ./.github/workflows/deploy-staging.yml
    # Only the one repository secret the release needs (least privilege; environment secrets such as the signing
    # key reach the called job through its environment: staging).
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
