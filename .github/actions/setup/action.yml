# Shared job setup: Node (.nvmrc), pnpm via corepack (the exact version in package.json "packageManager", as in
# the Dockerfile), a cached pnpm store, and a frozen install — which also re-verifies the lockfile against the
# supply-chain policies in pnpm-workspace.yaml (release age, trust policy, allowBuilds).
name: Setup
description: Node + pnpm + dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: pnpm (corepack)
      shell: bash
      run: |
        corepack enable
        corepack install
        echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
