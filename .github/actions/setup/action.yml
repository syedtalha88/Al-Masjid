# Shared job setup: Node (.nvmrc), pnpm via corepack (the exact version in package.json "packageManager", as in
# the Dockerfile), a cached pnpm store, and a frozen install — which also re-verifies the lockfile against the
# supply-chain policies in pnpm-workspace.yaml (release age, trust policy, allowBuilds).
name: Setup
description: Node + pnpm + dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: pnpm (corepack)
      shell: bash
      # A failed pnpm download once left the store path empty, and actions/cache then failed with "Input required
      # and not supplied: path" (16 Oct 2026). Retry the download; never continue with an empty path.
      run: |
        corepack enable
        for attempt in 1 2 3; do corepack install && break; [ "$attempt" -lt 3 ] || exit 1; sleep $((attempt * 10)); done
        store=$(pnpm store path --silent)
        [ -n "$store" ] || { echo "::error title=pnpm store path empty::pnpm store path printed nothing"; exit 1; }
        echo "PNPM_STORE=$store" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
