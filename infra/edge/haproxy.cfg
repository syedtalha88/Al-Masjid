# Edge router for the one VPS (DECISIONS #42, #54) — TCP mode, routes TLS connections by SNI to the environment's
# own Caddy. It never decrypts and holds no certificates: each Caddy terminates TLS with its Cloudflare Origin CA
# certificate and verifies Cloudflare's client certificate (Authenticated Origin Pulls). Port 443 on the host only
# accepts Cloudflare's IP ranges (ufw + DOCKER-USER, provision.sh). DRAFT — first run with the owner in T0.14.

global
	log stdout format raw local0 notice
	maxconn 4096

defaults
	mode tcp
	log global
	option tcplog
	timeout connect 5s
	timeout client 75s
	timeout server 75s

# Docker's embedded DNS: environment web containers are found by their network alias, re-resolved at runtime, so the
# router starts even when an environment is down.
resolvers docker
	nameserver dns 127.0.0.11:53
	hold valid 10s

frontend tls
	bind :8443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }
	tcp-request content reject unless { req.ssl_sni -m found }
	use_backend staging if { req.ssl_sni -i app-staging.almasjids.com admin-staging.almasjids.com media-staging.almasjids.com }
	use_backend production if { req.ssl_sni -i app.almasjids.com admin.almasjids.com media.almasjids.com }
	default_backend unknown

backend staging
	server web web-staging:8443 resolvers docker init-addr none check

backend production
	server web web-production:8443 resolvers docker init-addr none check

# Any other host name: no server → the connection is closed.
backend unknown
	tcp-request content reject
