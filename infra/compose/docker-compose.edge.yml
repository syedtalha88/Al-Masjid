# VPS edge (DECISIONS #54): the only container that publishes a port. Routes TLS by SNI to mc-staging / mc-production.
#   docker compose -p mc-edge -f /usr/local/lib/masjid-connect/edge/docker-compose.edge.yml up -d --wait   (once)
# Creates the two edge networks that each environment's `web` joins (as an external network).
# DRAFT 14 Oct 2026 — first run with the owner in T0.14.

services:
  router:
    image: haproxy:3.4.6-alpine@sha256:7af8255207ee9964ccb4eec8ce4b7a40b777769665e3ae83897fb01b24d8a43a
    user: '99:99' # haproxy
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      # Host 443 → 8443 (non-root). ufw + DOCKER-USER allow only Cloudflare's ranges (infra/vps/provision.sh).
      - '443:8443'
    volumes:
      # Root-owned host copy installed by `provision.sh host <sha>` — never a release checkout (review S-H1).
      - ${MC_EDGE_DIR:-/usr/local/lib/masjid-connect/edge}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      # `ingress` only carries the published port (Docker publishes ports only on a non-internal network); the edge
      # networks to each environment's web container are internal — web has no route to the internet (re-review S-L9).
      - ingress
      - edge-staging
      - edge-production
    healthcheck:
      # Valid config AND actually listening (re-review S-L9: a config check alone passes while the frontend is down).
      test: ['CMD-SHELL', 'haproxy -c -q -f /usr/local/etc/haproxy/haproxy.cfg && nc -z -w 3 127.0.0.1 8443']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: '0.50', memory: 64m }
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '5'

networks:
  ingress:
    name: mc-edge-ingress
  edge-staging:
    name: mc-edge-staging
    internal: true
  edge-production:
    name: mc-edge-production
    internal: true
