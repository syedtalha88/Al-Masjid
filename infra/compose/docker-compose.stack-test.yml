# E2E variant of the local stack (`pnpm stack:up:test`), layered on docker-compose.stack.yml: the server
# services run the `runtime-test` image (shipped runtime + the e2e test-hook module — DECISIONS #31) with
# NODE_ENV=test, so the APIs mount /api/v1/test/* and /api/admin/test/* (10 §3). `pnpm stack:up` switches
# back to the shipped `runtime` image. Never used for staging or production.

x-test-server: &test-server
  image: mc-server:test
  build:
    context: ../..
    dockerfile: infra/docker/server.Dockerfile
    target: runtime-test
  environment:
    NODE_ENV: test

# The UPI change-lock e2e (journey 9) checks the real 24 h hold with the api-admin clock hook; with the 2-minute local
# hold the worker's own 10-minute schedule could put the new details live in the middle of the test. (A service's
# `environment` replaces the anchor's, so NODE_ENV is repeated.)
x-test-env-hold: &test-env-hold
  NODE_ENV: test
  PAYMENT_HOLD_MINUTES: '1440'

services:
  api-public:
    <<: *test-server
  api-admin:
    <<: *test-server
    environment: *test-env-hold
  worker:
    <<: *test-server
    environment: *test-env-hold
