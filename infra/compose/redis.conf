# Redis for Masjid Connect (local dev, CI and the VPS stack). No secrets here: users and passwords come
# from the ACL file mounted at /usr/local/etc/redis/users.acl (generated locally by `pnpm setup:local`;
# on the VPS by provision.sh). 04 §12.2, DECISIONS #9, #34.

# Never published to the internet; in containers it is reachable only on the private network.
bind 0.0.0.0 ::
protected-mode yes
port 6379

# Per-process ACL users; the default user is disabled in the ACL file.
aclfile /usr/local/etc/redis/users.acl

# BullMQ requirement: keys must never be evicted.
maxmemory-policy noeviction

# Durability for queues (DECISIONS #9): append-only file, fsync every second.
appendonly yes
appendfsync everysec
dir /data

